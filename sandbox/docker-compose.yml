
version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  runner:
    image: mcr.microsoft.com/devcontainers/universal:2-linux
    working_dir: /workspace
    volumes:
      - ../:/workspace:cached
    # Sửa lại đường dẫn cho đúng
    command: bash -lc "node /workspace/health/backend_agent/server.js & chmod +x /workspace/sandbox/tests/run_tests.sh && /workspace/sandbox/tests/run_tests.sh"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

volumes:
  pgdata:


